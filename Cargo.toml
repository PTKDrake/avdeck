[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
avdeck-core = { path = "crates/avdeck-core" }
avdeck-grpc = { path = "crates/avdeck-grpc" }
anyhow = "1.0.104"
eframe = "0.37.0"
png = "0.18.1"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
protoc-bin-vendored = "3.3.0"
tokio = "1.54.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
windows-sys = "0.61.2"
